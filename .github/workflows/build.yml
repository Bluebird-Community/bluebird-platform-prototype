name: Build and Test

on:
  push:
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: 21
      - name: Validate the project (fail fast)
        run: mvn -B validate
      - name: Build and verify
        run: mvn -B verify